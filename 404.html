<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Nicole Glassman</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f5f2; --ink:#1c2531; --ink-2:#4b5563; --line:#d5dad6; --accent:#3b39d6; --accent-ink:#2c2ab0;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0f1216; --ink:#e7ebef; --ink-2:#b4bcc6; --line:#2b323b; --accent:#9695ff; --accent-ink:#b5b4ff }
}
:root[data-theme="dark"]{ --paper:#0f1216; --ink:#e7ebef; --ink-2:#b4bcc6; --line:#2b323b; --accent:#9695ff; --accent-ink:#b5b4ff }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:520px;width:100%}
.kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-0.01em;margin:0 0 14px}
p{color:var(--ink-2);margin:0 0 22px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:flex;justify-content:space-between;gap:16px;padding:14px 0;color:var(--ink);text-decoration:none}
li a:hover b{color:var(--accent-ink)}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
li b{font-weight:600}
li span{color:var(--ink-2);font-size:14px;text-align:right}
</style>
</head>
<body>
<main>
  <p class="kicker">404 · Page not found</p>
  <h1>That page isn't here.</h1>
  <p>The link may be out of date or mistyped. Everything on this site is one of these three pages.</p>
  <ul>
    <li><a href="/"><b>Home</b><span>who I am and how to reach me</span></a></li>
    <li><a href="/pov/"><b>Point of view</b><span>what I'd change about most brands' social</span></a></li>
    <li><a href="/buildcheck/"><b>Buildcheck demo</b><span>AI-assisted QA for paid-social builds</span></a></li>
  </ul>
</main>
<script>
(function(){ try{ const s=localStorage.getItem('bc-theme'); if(s==='dark'||s==='light') document.documentElement.setAttribute('data-theme',s); }catch(e){} })();
</script>
</body>
</html>
