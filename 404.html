<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Nicole Glassman</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#E9E2F1">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2EA; --white:#FFFFFF; --ink:#1B1A17; --ink-2:#3F3B33; --muted:#5C584F; --rule:#E2DCCF;
  --accent:#6A3FA0; --accent-hover:#4E2C7A; --band:#E9E2F1;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;-webkit-font-smoothing:antialiased}
main{max-width:560px;width:100%;border-top:2px solid var(--ink);padding-top:20px}
.kicker{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 16px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1;letter-spacing:-0.025em;margin:0 0 20px}
p{color:var(--ink-2);font-size:17px;margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
li{border-bottom:1px solid var(--rule)}
li a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-height:44px;padding:14px 0;color:var(--ink);text-decoration:none}
li a:hover b{color:var(--accent-hover);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
li b{font-weight:700;color:var(--accent);white-space:nowrap}
li span{color:var(--muted);font-size:14px;text-align:right}
</style>
</head>
<body>
<main>
  <p class="kicker">404 · Page not found</p>
  <h1>That page isn't here.</h1>
  <p>The link may be out of date or mistyped. Everything on this site is one of these three pages.</p>
  <ul>
    <li><a href="/"><b>Home</b><span>who I am and how to reach me</span></a></li>
    <li><a href="/pov/"><b>Point of view</b><span>what I'd change about most brands' social</span></a></li>
    <li><a href="/buildcheck/"><b>Buildcheck demo</b><span>AI-assisted QA for paid-social builds</span></a></li>
  </ul>
</main>
</body>
</html>
